<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>長者防跌報告產生器</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --blue: #2166ae;
        --blue-dark: #174f8c;
        --blue-light: #e8f2fb;
        --gray-50: #f8f9fa;
        --gray-100: #f0f2f5;
        --gray-200: #e2e8f0;
        --gray-400: #9ca3af;
        --gray-600: #6b7280;
        --gray-900: #111827;
        --radius: 10px;
        --gap: 14px;
      }
      html {
        background: #525659;
        min-height: 100vh;
        padding: 32px 0;
      }
      body {
        font-family: "Noto Sans TC", sans-serif;
        color: var(--gray-900);
        font-size: 15px;
        line-height: 1.55;
      }
      #upload-screen {
        width: 520px;
        margin: 60px auto;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 4px 40px rgba(0, 0, 0, 0.35);
        overflow: hidden;
      }
      .up-hdr {
        background: linear-gradient(135deg, var(--blue-dark), var(--blue));
        padding: 22px 28px;
        color: #fff;
      }
      .up-hdr-title {
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 0.04em;
      }
      .up-hdr-sub {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.7);
        margin-top: 3px;
      }
      .up-body {
        padding: 28px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .drop-zone {
        border: 2.5px dashed var(--gray-200);
        border-radius: 12px;
        padding: 36px 20px;
        text-align: center;
        cursor: pointer;
        transition:
          border-color 0.2s,
          background 0.2s;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .drop-zone:hover,
      .drop-zone.drag-over {
        border-color: var(--blue);
        background: var(--blue-light);
      }
      .drop-zone i {
        font-size: 36px;
        color: var(--blue);
        opacity: 0.6;
      }
      .drop-zone-text {
        font-size: 15px;
        font-weight: 700;
        color: var(--gray-900);
      }
      .drop-zone-sub {
        font-size: 12px;
        color: var(--gray-600);
      }
      #file-input {
        display: none;
      }
      .btn-primary {
        background: var(--blue);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 12px 24px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
        transition: background 0.15s;
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: center;
      }
      .btn-primary:hover {
        background: var(--blue-dark);
      }
      .btn-primary:disabled {
        background: var(--gray-400);
        cursor: not-allowed;
      }
      .status-msg {
        font-size: 13px;
        color: var(--gray-600);
        text-align: center;
        min-height: 18px;
      }
      .status-msg.ok {
        color: #16a34a;
        font-weight: 700;
      }
      .status-msg.err {
        color: #dc2626;
        font-weight: 700;
      }
      #report-screen {
        display: none;
      }
      .page {
        width: 794px;
        background: #fff;
        margin: 0 auto 32px;
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.15),
          0 4px 32px rgba(0, 0, 0, 0.45),
          0 12px 60px rgba(0, 0, 0, 0.25);
        display: flex;
        flex-direction: column;
        position: relative;
      }
      .page::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, #174f8c, #2166ae, #4a9fd4);
        z-index: 10;
      }
      @media print {
        html {
          background: #fff;
          padding: 0;
        }
        body {
          margin: 0;
          padding: 0;
        }
        #upload-screen {
          display: none !important;
        }
        #report-screen {
          display: block !important;
          padding: 0;
        }
        .page {
          box-shadow: none;
          margin: 0;
          min-height: unset;
          page-break-after: always;
          page-break-inside: avoid;
        }
        .page:last-child {
          page-break-after: avoid;
        }
        @page {
          size: A4 portrait;
          margin: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="upload-screen">
      <div class="up-hdr">
        <div class="up-hdr-title">
          <i
            class="fa-solid fa-file-waveform"
            style="margin-right: 8px; opacity: 0.8"
          ></i
          >長者防跌報告產生器
        </div>
        <div class="up-hdr-sub">
          Fall Risk Retrospective &amp; Recovery Report Generator
        </div>
      </div>
      <div class="up-body">
        <div
          class="drop-zone"
          id="drop-zone"
          onclick="document.getElementById('file-input').click()"
        >
          <i class="fa-solid fa-file-excel"></i>
          <div class="drop-zone-text">點擊或拖曳 Excel 檔案至此</div>
          <div class="drop-zone-sub">支援 .xlsx 格式（需含 No 欄位）</div>
        </div>
        <input type="file" id="file-input" accept=".xlsx" />
        <div id="status-msg" class="status-msg">尚未選擇檔案</div>
        <button
          class="btn-primary"
          id="gen-btn"
          disabled
          onclick="generateAllReports()"
        >
          <i class="fa-solid fa-wand-magic-sparkles"></i>產生報告
        </button>
      </div>
    </div>

    <div id="list-screen" style="display: none; padding: 20px">
      <h2 style="color: #fff">長者防跌回溯報告列表</h2>
      <div
        id="person-list"
        style="
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
          gap: 10px;
        "
      ></div>
    </div>

    <div id="report-screen"></div>

    <script>
      function tsToDateStr(ts) {
        const d = new Date(Number(ts));
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return y + "/" + m + "/" + day;
      }
      function fmtDate(d) {
        return d.replace(/\//g, ".");
      }
      function genderLabel(g) {
        if (g === "0" || g === 0 || g === "女") return "女";
        if (g === "1" || g === 1 || g === "男") return "男";
        return String(g);
      }
      function levelToScore(text) {
        const map = { 低: 12, 稍低: 9, 中: 6, 稍高: 3, 高: 1 };
        const t = String(text).trim();
        return map[t] !== undefined ? map[t] : 6;
      }

      let groupedData = null;
      const dropZone = document.getElementById("drop-zone");
      const fileInput = document.getElementById("file-input");
      const statusMsg = document.getElementById("status-msg");
      const genBtn = document.getElementById("gen-btn");

      dropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZone.classList.add("drag-over");
      });
      dropZone.addEventListener("dragleave", () =>
        dropZone.classList.remove("drag-over"),
      );
      dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropZone.classList.remove("drag-over");
        if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
      });
      fileInput.addEventListener("change", () => {
        if (fileInput.files[0]) handleFile(fileInput.files[0]);
      });

      function handleFile(file) {
        if (!file.name.endsWith(".xlsx")) {
          statusMsg.textContent = "請上傳 .xlsx 格式的檔案";
          statusMsg.className = "status-msg err";
          return;
        }
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const wb = XLSX.read(e.target.result, { type: "array" });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(ws, { defval: "" });
            if (!rows.length) throw new Error("無有效資料列");
            const required = [
              "No",
              "name",
              "gender",
              "age",
              "chairstandsecond",
              "gaitspeed",
              "balancesecond1",
              "balancesecond2",
              "balancesecond3",
              "date",
              "location",
              "左偏移",
              "右偏移",
              "跌倒風險機率",
              "跌倒風險等級",
            ];
            const keys = Object.keys(rows[0]);
            const missing = required.filter((k) => !keys.includes(k));
            if (missing.length)
              throw new Error("缺少欄位：" + missing.join(", "));
            const groups = {};
            rows.forEach((r) => {
              const no = String(r.No).trim();
              if (!groups[no]) groups[no] = [];
              groups[no].push(r);
            });
            Object.keys(groups).forEach((no) => {
              groups[no].sort((a, b) => Number(a.date) - Number(b.date));
            });
            groupedData = groups;
            const total = rows.length;
            const people = Object.keys(groups).length;
            statusMsg.textContent = `✓ 已讀取 ${total} 筆紀錄，共 ${people} 位長者`;
            statusMsg.className = "status-msg ok";
            genBtn.disabled = false;
          } catch (err) {
            statusMsg.textContent = "解析失敗：" + err.message;
            statusMsg.className = "status-msg err";
            genBtn.disabled = true;
          }
        };
        reader.readAsArrayBuffer(file);
      }

      function generateAllReports() {
        if (!groupedData) return;
        document.getElementById("upload-screen").style.display = "none";
        const listScreen = document.getElementById("list-screen");
        listScreen.style.display = "block";
        const personList = document.getElementById("person-list");
        personList.innerHTML = "";
        Object.keys(groupedData).forEach((no) => {
          const btn = document.createElement("button");
          btn.textContent = `長者編號：${no}`;
          btn.onclick = () => {
            sessionStorage.setItem(
              "selectedPersonData",
              JSON.stringify(groupedData[no]),
            );
            window.open("report_template.html", "_blank");
          };
          personList.appendChild(btn);
        });
      }
    </script>
  </body>
</html>
