<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>長者防跌回溯報告</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --blue: #2166ae;
      --blue-dark: #174f8c;
      --blue-light: #e8f2fb;
      --gray-50: #f8f9fa;
      --gray-100: #f0f2f5;
      --gray-200: #e2e8f0;
      --gray-400: #9ca3af;
      --gray-600: #6b7280;
      --gray-900: #111827;
      --radius: 8px;
      --gap: 8px;
    }
    html {
      background: #525659;
      min-height: 100vh;
      padding: 20px 0;
    }
    body {
      font-family: "Noto Sans TC", sans-serif;
      color: var(--gray-900);
      font-size: 14px;
      line-height: 1.45;
    }
    .page {
      width: 794px;
      background: #fff;
      margin: 0 auto 24px;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.15),
        0 4px 32px rgba(0, 0, 0, 0.45),
        0 12px 60px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .page::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #174f8c, #2166ae, #4a9fd4);
      z-index: 10;
    }
    @media print {
      html {
        background: #fff;
        padding: 0;
      }
      body {
        margin: 0;
        padding: 0;
      }
      #upload-screen {
        display: none !important;
      }
      #report-screen {
        display: block !important;
        padding: 0;
      }
      .page {
        box-shadow: none;
        margin: 0;
        min-height: unset;
        page-break-after: always;
        page-break-inside: avoid;
      }
      .page:last-child {
        page-break-after: avoid;
      }
      @page {
        size: A4 portrait;
        margin: 0;
      }
    }

    /* ── Header ── */
    .pg-header {
      background: linear-gradient(
        135deg,
        var(--blue-dark) 0%,
        var(--blue) 100%
      );
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .hdr-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .hdr-logo-text {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }
    .hdr-logo-sub {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 400;
      font-style: italic;
      margin-top: 1px;
    }
    .hdr-title {
      text-align: right;
    }
    .hdr-title-main {
      font-size: 19px;
      font-weight: 900;
      color: #fff;
      letter-spacing: 0.05em;
    }
    .hdr-title-sub {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    /* ── Body ── */
    .pg-body {
      flex: 1;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: var(--gap);
    }

    .card-hdr {
      background: var(--blue-dark);
      color: #fff;
      padding: 7px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.06em;
      border-radius: var(--radius) var(--radius) 0 0;
    }
    .card-hdr i {
      font-size: 11px;
      opacity: 0.7;
    }

    /* ── Top row ── */
    .top-row {
      display: flex;
      gap: var(--gap);
    }
    .top-left {
      flex: 1;
      display: flex;
      gap: 9px;
    }

    .stick-panel {
      flex: 3;
      min-width: 0;
      flex-shrink: 0;
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--gray-200);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px 8px 8px;
    }
    .stick-figure {
      width: 100%;
    }
    .stick-last-date {
      width: 100%;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--gray-200);
      font-size: 12px;
      color: var(--gray-600);
      text-align: center;
      line-height: 1.4;
    }
    .stick-last-date strong {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--blue);
      font-family: "DM Mono", monospace;
    }

    .info-card {
      flex: 4;
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--gray-200);
      overflow: hidden;
    }
    .info-card-hdr {
      background: var(--blue);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      letter-spacing: 0.05em;
    }
    .info-card-body {
      padding: 8px 12px;
    }

    .gauge-panel {
      flex: 3;
      min-width: 0;
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--gray-200);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .gauge-panel-hdr {
      background: var(--blue);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      letter-spacing: 0.05em;
      flex-shrink: 0;
    }

    .kv-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .kv-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 2px;
      border-bottom: 1px solid var(--gray-100);
      gap: 6px;
    }
    .kv-row:last-child {
      border-bottom: none;
    }
    .kv-lbl {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      color: var(--gray-600);
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .kv-lbl i {
      font-size: 11px;
      color: var(--blue);
      opacity: 0.7;
      width: 13px;
      text-align: center;
    }
    .kv-val {
      font-size: 13px;
      font-weight: 700;
      color: var(--gray-900);
      text-align: right;
    }
    .kv-val.mono {
      font-family: "DM Mono", monospace;
      font-size: 12px;
    }

    /* ── Chart rows ── */
    .mob-row {
      display: flex;
      gap: var(--gap);
    }
    .mob-card {
      flex: 1;
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--gray-200);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .mob-card-hdr {
      background: var(--blue);
      color: #fff;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .mob-card-hdr-left {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .mob-card-body {
      padding: 7px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }
    .mob-chart-wrap {
      height: 90px !important;
      position: relative;
      margin-top: 4px;
    }
    .mob-chart-wrap canvas {
      width: 100% !important;
      height: 100% !important;
    }

    /* ── Alert ── */
    .alert-card {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--gray-200);
      overflow: hidden;
    }
    .alert-card-hdr {
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.04em;
    }
    .alert-card-hdr i {
      font-size: 13px;
    }
    .alert-card-body {
      padding: 8px 16px;
    }
    .alert-intro {
      font-size: 12.5px;
      font-weight: 500;
      line-height: 1.65;
    }
    .alert-good {
      border-left: 4px solid #2166ae;
    }
    .alert-good .alert-card-hdr {
      background: var(--blue-light);
      color: var(--blue-dark);
    }
    .alert-good .alert-card-hdr i {
      color: var(--blue);
    }
    .alert-mid {
      border-left: 4px solid #d97706;
    }
    .alert-mid .alert-card-hdr {
      background: #fffbeb;
      color: #92400e;
    }
    .alert-mid .alert-card-hdr i {
      color: #d97706;
    }
    .alert-mid .alert-intro {
      color: #78350f;
    }
    .alert-high {
      border-left: 4px solid #ea580c;
    }
    .alert-high .alert-card-hdr {
      background: #fff7ed;
      color: #9a3412;
    }
    .alert-high .alert-card-hdr i {
      color: #ea580c;
    }
    .alert-high .alert-intro {
      color: #7c2d12;
    }
    .alert-danger {
      border-left: 4px solid #dc2626;
    }
    .alert-danger .alert-card-hdr {
      background: #fef2f2;
      color: #7f1d1d;
    }
    .alert-danger .alert-card-hdr i {
      color: #dc2626;
    }
    .alert-danger .alert-intro {
      color: #7f1d1d;
    }

    /* ── Suggest ── */
    .suggest-wrap {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--gray-200);
      overflow: hidden;
    }
    .suggest-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .sg {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
      background: #fff;
    }
    .sg::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
    }
    .sg.s1::after {
      background: #22c55e;
    }
    .sg.s2::after {
      background: #f97316;
    }
    .sg.s3::after {
      background: #3b82f6;
    }
    .sg.s4::after {
      background: #8b5cf6;
    }
    .sg:nth-child(1),
    .sg:nth-child(2) {
      border-bottom: 1.5px solid var(--gray-200);
    }
    .sg:nth-child(1),
    .sg:nth-child(3) {
      border-right: 1.5px solid var(--gray-200);
    }
    .sg-top {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .sg-ico {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .sg-ico i {
      font-size: 16px;
      color: #fff;
    }
    .s1 .sg-ico {
      background: #22c55e;
    }
    .s2 .sg-ico {
      background: #f97316;
    }
    .s3 .sg-ico {
      background: #3b82f6;
    }
    .s4 .sg-ico {
      background: #8b5cf6;
    }
    .sg-num {
      font-size: 10px;
      font-weight: 700;
      color: var(--gray-600);
      letter-spacing: 0.06em;
    }
    .sg-name {
      font-size: 14px;
      font-weight: 900;
      line-height: 1.15;
    }
    .s1 .sg-name {
      color: #166534;
    }
    .s2 .sg-name {
      color: #9a3412;
    }
    .s3 .sg-name {
      color: #1e40af;
    }
    .s4 .sg-name {
      color: #5b21b6;
    }
    .sg-bullets {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .sg-bullets li {
      font-size: 12.5px;
      color: #374151;
      line-height: 1.55;
      padding-left: 13px;
      position: relative;
    }
    .sg-bullets li::before {
      content: "•";
      position: absolute;
      left: 2px;
      color: var(--gray-400);
      font-size: 9px;
      top: 1px;
    }
    .sg-with-qr {
      flex: 1;
      display: flex;
      flex-direction: row;
      gap: 8px;
    }
    .sg-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sg-qr-side {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
    }
    .sg-qr-img {
      width: 70px;
      height: 70px;
      border-radius: 6px;
      border: 1.5px solid var(--gray-200);
      object-fit: cover;
      background: var(--gray-100);
    }
    .sg-qr-txt {
      font-size: 9px;
      color: var(--gray-600);
      text-align: center;
      line-height: 1.4;
    }

    /* ── Footer ── */
    .pg-footer {
      padding: 9px 16px 11px;
      border-top: 1px solid var(--gray-200);
      background: #fafbfc;
    }
    .pg-footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .pg-footer-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .pg-footer-note {
      font-size: 11px;
      color: var(--gray-600);
      line-height: 1.5;
    }
    .pg-footer-date {
      font-family: "DM Mono", monospace;
      font-size: 10.5px;
      color: var(--gray-600);
      font-weight: 500;
    }
    .pg-footer-contact {
      display: flex;
      gap: 16px;
      margin-top: 2px;
    }
    .pg-footer-contact-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--gray-600);
    }
    .pg-footer-contact-item i {
      font-size: 10px;
      color: var(--blue);
      opacity: 0.8;
    }
    .pg-footer-cert {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding-left: 16px;
      border-left: 1px solid var(--gray-200);
    }
    .pg-footer-cert-title {
      font-size: 10px;
      font-weight: 700;
      color: var(--gray-600);
      letter-spacing: 0.06em;
    }
    .pg-footer-cert-img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      border: 1px solid var(--gray-200);
      background: var(--gray-50);
    }
    .pg-footer-cert-copy {
      font-size: 9px;
      color: var(--gray-400);
      text-align: center;
      line-height: 1.5;
    }
  </style>
  <body>
    <div id="report-screen"></div>
    <script>
      let allCharts = [];
      function destroyAllCharts() {
        allCharts.forEach((c) => {
          try {
            c.destroy();
          } catch (e) {}
        });
        allCharts = [];
      }
      function tsToDateStr(ts) {
        const d = new Date(Number(ts));
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return y + "/" + m + "/" + day;
      }
      function fmtDate(d) {
        return d.replace(/\//g, ".");
      }
      function genderLabel(g) {
        if (g === "0" || g === 0 || g === "女") return "女";
        if (g === "1" || g === 1 || g === "男") return "男";
        return String(g);
      }
      function levelToScore(text) {
        const map = { 低: 12, 稍低: 9, 中: 6, 稍高: 3, 高: 1 };
        const t = String(text).trim();
        return map[t] !== undefined ? map[t] : 6;
      }

      /* ── 圓點置中 / 黃金分割輔助 ──
         單筆：補成 3 格，點落在正中 50%
         兩筆：補成 14 格，兩點落在第 5、8 格＝5/13≈38.5%、8/13≈61.5%（最接近黃金分割且對稱）
         三筆以上：完全照原本，不補白 */
      function padForCentering(labels, values) {
        const n = values.length;
        if (n === 1) {
          return {
            labels: ["", labels[0], ""],
            data: [null, values[0], null],
            spanGaps: false,
          };
        }
        if (n === 2) {
          const blank = (k) => Array(k).fill("");
          const nul = (k) => Array(k).fill(null);
          return {
            labels: [
              ...blank(5),
              labels[0],
              ...blank(2),
              labels[1],
              ...blank(5),
            ],
            data: [...nul(5), values[0], ...nul(2), values[1], ...nul(5)],
            spanGaps: true,
          };
        }
        return { labels, data: values, spanGaps: true };
      }

      function buildBodyHTML(leftRaw, rightRaw, gender, uid) {
        const imgSrc =
          genderLabel(gender) === "男"
            ? "https://raw.githubusercontent.com/Wayne-Chou/report-template/refs/heads/main/assets/figure_male.png"
            : "https://raw.githubusercontent.com/Wayne-Chou/report-template/refs/heads/main/assets/figure_female.png";
        const canvasId = uid + "_body_canvas";
        return `
<div style="position:relative;display:inline-block;width:100%">
  <img src="${imgSrc}" alt="人形" id="${uid}_body_img" style="width:100%;display:block;"
       onload="drawBodyLines('${canvasId}','${uid}_body_img',${Math.abs(parseFloat(leftRaw) || 0)},${Math.abs(parseFloat(rightRaw) || 0)})"/>
  <canvas id="${canvasId}" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;"></canvas>
</div>
<div style="display:flex;gap:8px;justify-content:center;margin-top:5px;font-size:10px;color:#374151;">
  <span style="display:flex;align-items:center;gap:3px;"><span style="width:14px;height:2px;background:#22c55e;display:inline-block;border-radius:2px;"></span>重心</span>
  <span style="display:flex;align-items:center;gap:3px;"><span style="width:14px;height:2px;background:#ef4444;display:inline-block;border-radius:2px;"></span>右偏</span>
  <span style="display:flex;align-items:center;gap:3px;"><span style="width:14px;height:2px;background:#f5a623;display:inline-block;border-radius:2px;"></span>左偏</span>
</div>`;
      }

      function drawBodyLines(canvasId, imgId, leftDeg, rightDeg) {
        const img = document.getElementById(imgId);
        const canvas = document.getElementById(canvasId);
        if (!img || !canvas) return;
        const w = img.offsetWidth,
          h = img.offsetHeight;
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        const hipX = w * 0.5,
          hipY = h * 0.58,
          shY = h * 0.28,
          len = hipY - shY;
        function drawLine(deg, dir, color) {
          const rad = (deg * Math.PI) / 180;
          const ex = hipX + dir * len * Math.sin(rad),
            ey = hipY - len * Math.cos(rad);
          ctx.beginPath();
          ctx.moveTo(hipX, hipY);
          ctx.lineTo(ex, ey);
          ctx.strokeStyle = color;
          ctx.lineWidth = 3;
          ctx.lineCap = "round";
          ctx.stroke();
        }
        drawLine(leftDeg, -1, "#f5a623");
        drawLine(0, 0, "#22c55e");
        drawLine(rightDeg, 1, "#ef4444");
      }

      function buildPageHTML(no, data) {
        const uid = "p" + no.replace(/\W/g, "_");
        const first = data[0];
        const last = data[data.length - 1];
        const firstDate = fmtDate(tsToDateStr(first.date));
        const lastDate = fmtDate(tsToDateStr(last.date));
        const isSingle = data.length === 1;
        const periodHTML = isSingle
          ? `${lastDate}(僅單次鑑測)`
          : `${firstDate} – ${lastDate}`;
        const gaugeScore = levelToScore(last["跌倒風險等級"]);
        const alertHTML = buildAlertHTML(gaugeScore);
        const leftRaw = last["左偏移"] ?? 0;
        const rightRaw = last["右偏移"] ?? 0;
        const bodyHTML = buildBodyHTML(leftRaw, rightRaw, first.gender, uid);

        const div = document.createElement("div");
        div.className = "page";
        div.innerHTML = `
          <div class="pg-header">
            <div class="hdr-logo">
              <div><img style="width:40px;display:block" src="https://raw.githubusercontent.com/Wayne-Chou/report-template/refs/heads/main/assets/logo.png" alt="建豐健康科技"></div>
              <div>
                <div class="hdr-logo-text">建豐健康科技</div>
                <div class="hdr-logo-sub">FongAI Co., Ltd</div>
              </div>
            </div>
            <div class="hdr-title">
              <div class="hdr-title-sub">Fall Risk Retrospective &amp; Recovery Report</div>
              <div class="hdr-title-main">長者防跌回溯與復能建議報告</div>
            </div>
          </div>

          <div class="pg-body">
            <div class="top-row">
              <div class="top-left">

      function buildGauge(canvasId, score) {
        const rc = {
          danger: "#ff5757",
          high: "#ffa203",
          medium: "#ffd039",
          low: "#8cff00",
          veryLow: "#4ffa00",
        };
        function getLevel(val) {
          if (val <= 2) return { text: "危險", color: rc.danger };
          if (val <= 5) return { text: "高風險", color: rc.high };
          if (val <= 8) return { text: "中度", color: rc.medium };
          if (val <= 11) return { text: "稍低", color: rc.low };
          return { text: "低風險", color: rc.veryLow };
        }
        const level = getLevel(score);
        allCharts.push(
          new Chart(document.getElementById(canvasId), {
            type: "doughnut",
            data: {
              datasets: [
                {
                  data: [1, 1, 1, 1, 1],
                  backgroundColor: [
                    rc.danger,
                    rc.high,
                    rc.medium,
                    rc.low,
                    rc.veryLow,
                  ],
                  circumference: 180,
                  rotation: 270,
                  borderWidth: 3,
                  borderColor: "#ffffff",
                  cutout: "80%",
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              layout: { padding: { top: 28, bottom: 8 } },
              plugins: {
                legend: { display: false },
                tooltip: { enabled: false },
              },
            },
            plugins: [
              {
                id: "needleAndText",
                afterDraw(chart) {
                  const { ctx, chartArea } = chart;
                  const cx = (chartArea.left + chartArea.right) / 2;
                  const cy = chartArea.bottom - 10;
                  const ir = chart.getDatasetMeta(0).controller.innerRadius;
                  ctx.save();
                  ctx.font = "bold 12px sans-serif";
                  ctx.fillStyle = "#1e293b";
                  ctx.textAlign = "center";
                  ctx.textBaseline = "middle";
                  ctx.fillText("風險等級：" + level.text, cx, cy);
                  const angle = Math.PI + Math.PI * (score / 12);
                  const sd = 10,
                    ed = ir - 2,
                    as = 8,
                    ba = 0.4;
                  const sx = cx + Math.cos(angle) * sd,
                    sy = cy + Math.sin(angle) * sd;
                  const tx = cx + Math.cos(angle) * ed,
                    ty = cy + Math.sin(angle) * ed;
                  ctx.beginPath();
                  ctx.moveTo(sx, sy);
                  ctx.lineTo(tx, ty);
                  ctx.strokeStyle = "#334155";
                  ctx.lineWidth = 2.5;
                  ctx.stroke();
                  ctx.beginPath();
                  ctx.moveTo(tx, ty);
                  ctx.lineTo(
                    tx - as * Math.cos(angle - ba),
                    ty - as * Math.sin(angle - ba),
                  );
                  ctx.lineTo(
                    tx - as * Math.cos(angle + ba),
                    ty - as * Math.sin(angle + ba),
                  );
                  ctx.closePath();
                  ctx.fillStyle = "#334155";
                  ctx.fill();
                  ctx.restore();
                },
              },
            ],
          }),
        );
      }

          return `<div class="alert-card alert-mid"><div class="alert-card-hdr"><i class="fa-solid fa-triangle-exclamation"></i>中度風險，建議定期追蹤與功能維持</div><div class="alert-card-body"><div class="alert-intro">本次評估結果顯示，受測者部分體能指標已呈現中度風險，可能反映其在步態穩定、平衡控制或下肢肌力表現上已有需關注之變化。建議後續定期追蹤功能狀態，並同步檢視用藥、視力、慢性疾病控制及居家環境安全。若近期有再次跌倒、步態明顯不穩或日常活動能力下降等情形，建議安排醫療、復健或相關專業人員進一步評估。</div></div></div>`;
        if (score >= 3)
          return `<div class="alert-card alert-high"><div class="alert-card-hdr"><i class="fa-solid fa-circle-exclamation"></i>風險偏高，建議安排專業評估與復能介入</div><div class="alert-card-body"><div class="alert-intro">本次評估結果顯示，受測者跌倒風險偏高，可能與步態穩定度下降、平衡控制不足或下肢肌力衰退有關。建議安排醫療、復健或相關專業人員進一步評估，並依受測者狀況規劃平衡訓練、下肢肌力訓練、步態訓練及日常活動安全指導。同時，應同步檢視用藥、視力與居家環境，以降低再次跌倒及跌倒後傷害風險。</div></div></div>`;
        return `<div class="alert-card alert-danger"><div class="alert-card-hdr"><i class="fa-solid fa-xmark-circle"></i>高度風險，建議儘速進行專業介入與照護調整</div><div class="alert-card-body"><div class="alert-intro">本次評估結果顯示，受測者跌倒風險已達高度風險等級，建議儘速由醫療、復健或相關專業人員進行全面性評估，包含步態、平衡、下肢肌力、輔具使用、居家環境及日常活動安全。後續應依評估結果安排個別化復能介入、家屬支持與環境改善措施，並提高短期追蹤頻率，以降低再次跌倒、跌倒受傷及功能退化風險。</div></div></div>`;
      }

      const rawData = sessionStorage.getItem("selectedPersonData");
      if (rawData) {
        const data = JSON.parse(rawData);
        const no = String(data[0].No);
        const screen = document.getElementById("report-screen");
        const pageEl = buildPageHTML(no, data);
        screen.appendChild(pageEl);
        renderCharts(pageEl, no, data);
      } else {
        document.body.innerHTML = "找不到資料，請回到主頁面重新選擇。";
      }
    </script>
  </body>
