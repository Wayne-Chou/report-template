<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>長者防跌回溯報告</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --blue: #2166ae;
      --blue-dark: #174f8c;
      --blue-light: #e8f2fb;
      --gray-50: #f8f9fa;
      --gray-100: #f0f2f5;
      --gray-200: #e2e8f0;
      --gray-400: #9ca3af;
      --gray-600: #6b7280;
      --gray-900: #111827;
      --radius: 10px;
      --gap: 14px;
    }
    html {
      background: #525659;
      min-height: 100vh;
      padding: 32px 0;
    }
    body {
      font-family: "Noto Sans TC", sans-serif;
      color: var(--gray-900);
      font-size: 15px;
      line-height: 1.55;
    }
    .page {
      width: 794px;
      background: #fff;
      margin: 0 auto 32px;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.15),
        0 4px 32px rgba(0, 0, 0, 0.45),
        0 12px 60px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .page::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #174f8c, #2166ae, #4a9fd4);
      z-index: 10;
    }
    @media print {
      html {
        background: #fff;
        padding: 0;
      }
      body {
        margin: 0;
        padding: 0;
      }
      #upload-screen {
        display: none !important;
      }
      #report-screen {
        display: block !important;
        padding: 0;
      }
      .page {
        box-shadow: none;
        margin: 0;
        min-height: unset;
        page-break-after: always;
        page-break-inside: avoid;
      }
      .page:last-child {
        page-break-after: avoid;
      }
      @page {
        size: A4 portrait;
        margin: 0;
      }
    }
    .pg-header {
      background: linear-gradient(
        135deg,
        var(--blue-dark) 0%,
        var(--blue) 100%
      );
      padding: 22px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .hdr-logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .hdr-logo-text {
      font-size: 19px;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }
    .hdr-logo-sub {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 400;
      font-style: italic;
      margin-top: 2px;
    }
    .hdr-title {
      text-align: right;
    }
    .hdr-title-main {
      font-size: 22px;
      font-weight: 900;
      color: #fff;
      letter-spacing: 0.05em;
    }
    .hdr-title-sub {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .pg-body {
      flex: 1;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: var(--gap);
    }
    .card-hdr {
      background: var(--blue-dark);
      color: #fff;
      padding: 9px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.06em;
      border-radius: var(--radius) var(--radius) 0 0;
    }
    .card-hdr i {
      font-size: 12px;
      opacity: 0.7;
    }
    .top-row {
      display: flex;
      gap: var(--gap);
    }
    .top-left {
      flex: 1;
      display: flex;
      gap: 11px;
    }
    .stick-panel {
      flex: 3;
      min-width: 0;
      flex-shrink: 0;
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.09);
      border: 1px solid var(--gray-200);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px 10px 10px;
    }
    .stick-figure {
      width: 100%;
    }
    .stick-last-date {
      width: 100%;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--gray-200);
      font-size: 13px;
      color: var(--gray-600);
      text-align: center;
      line-height: 1.5;
    }
    .stick-last-date strong {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--blue);
      font-family: "DM Mono", monospace;
    }
    .info-card {
      flex: 4;
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.09);
      border: 1px solid var(--gray-200);
      overflow: hidden;
    }
    .info-card-hdr {
      background: var(--blue);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 14px;
      letter-spacing: 0.05em;
    }
    .info-card-body {
      padding: 10px 14px;
    }
    .gauge-panel {
      flex: 3;
      min-width: 0;
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.09);
      border: 1px solid var(--gray-200);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .gauge-panel-hdr {
      background: var(--blue);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 14px;
      letter-spacing: 0.05em;
      flex-shrink: 0;
    }
    .kv-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .kv-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 2px;
      border-bottom: 1px solid var(--gray-100);
      gap: 8px;
    }
    .kv-row:last-child {
      border-bottom: none;
    }
    .kv-lbl {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: var(--gray-600);
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .kv-lbl i {
      font-size: 12px;
      color: var(--blue);
      opacity: 0.7;
      width: 14px;
      text-align: center;
    }
    .kv-val {
      font-size: 14px;
      font-weight: 700;
      color: var(--gray-900);
      text-align: right;
    }
    .kv-val.mono {
      font-family: "DM Mono", monospace;
      font-size: 13px;
    }
    .mob-row {
      display: flex;
      gap: var(--gap);
    }
    .mob-card {
      flex: 1;
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.09);
      border: 1px solid var(--gray-200);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .mob-card-hdr {
      background: var(--blue);
      color: #fff;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .mob-card-hdr-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .mob-card-body {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }
    .mob-chart-wrap {
      height: 82px;
      position: relative;
      margin-top: 6px;
    }
    .mob-chart-wrap canvas {
      width: 100% !important;
      height: 100% !important;
    }
    .suggest-wrap {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.09);
      border: 1px solid var(--gray-200);
      overflow: hidden;
    }
    .suggest-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .sg {
      padding: 13px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      background: #fff;
    }
    .sg::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
    }
    .sg.s1::after {
      background: #22c55e;
    }
    .sg.s2::after {
      background: #f97316;
    }
    .sg.s3::after {
      background: #3b82f6;
    }
    .sg.s4::after {
      background: #8b5cf6;
    }
    .sg:nth-child(1),
    .sg:nth-child(2) {
      border-bottom: 1.5px solid var(--gray-200);
    }
    .sg:nth-child(1),
    .sg:nth-child(3) {
      border-right: 1.5px solid var(--gray-200);
    }
    .sg-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sg-ico {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .sg-ico i {
      font-size: 18px;
      color: #fff;
    }
    .s1 .sg-ico {
      background: #22c55e;
    }
    .s2 .sg-ico {
      background: #f97316;
    }
    .s3 .sg-ico {
      background: #3b82f6;
    }
    .s4 .sg-ico {
      background: #8b5cf6;
    }
    .sg-num {
      font-size: 11px;
      font-weight: 700;
      color: var(--gray-600);
      letter-spacing: 0.06em;
    }
    .sg-name {
      font-size: 16px;
      font-weight: 900;
      line-height: 1.15;
    }
    .s1 .sg-name {
      color: #166534;
    }
    .s2 .sg-name {
      color: #9a3412;
    }
    .s3 .sg-name {
      color: #1e40af;
    }
    .s4 .sg-name {
      color: #5b21b6;
    }
    .sg-bullets {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .sg-bullets li {
      font-size: 13.5px;
      color: #374151;
      line-height: 1.6;
      padding-left: 14px;
      position: relative;
    }
    .sg-bullets li::before {
      content: "•";
      position: absolute;
      left: 2px;
      color: var(--gray-400);
      font-size: 10px;
      top: 1px;
    }
    .sg-with-qr {
      flex: 1;
      display: flex;
      flex-direction: row;
      gap: 10px;
    }
    .sg-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sg-qr-side {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
    }
    .sg-qr-img {
      width: 80px;
      height: 80px;
      border-radius: 7px;
      border: 1.5px solid var(--gray-200);
      object-fit: cover;
      background: var(--gray-100);
    }
    .sg-qr-txt {
      font-size: 10px;
      color: var(--gray-600);
      text-align: center;
      line-height: 1.4;
    }
    .alert-card {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.09);
      border: 1px solid var(--gray-200);
      overflow: hidden;
    }
    .alert-card-hdr {
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.04em;
    }
    .alert-card-hdr i {
      font-size: 14px;
    }
    .alert-card-body {
      padding: 12px 18px;
    }
    .alert-intro {
      font-size: 13.5px;
      font-weight: 500;
      line-height: 1.7;
    }
    .alert-good {
      border-left: 5px solid #2166ae;
    }
    .alert-good .alert-card-hdr {
      background: var(--blue-light);
      color: var(--blue-dark);
    }
    .alert-good .alert-card-hdr i {
      color: var(--blue);
    }
    .alert-good .alert-intro {
      color: var(--gray-900);
    }
    .alert-mid {
      border-left: 5px solid #d97706;
    }
    .alert-mid .alert-card-hdr {
      background: #fffbeb;
      color: #92400e;
    }
    .alert-mid .alert-card-hdr i {
      color: #d97706;
    }
    .alert-mid .alert-intro {
      color: #78350f;
    }
    .alert-high {
      border-left: 5px solid #ea580c;
    }
    .alert-high .alert-card-hdr {
      background: #fff7ed;
      color: #9a3412;
    }
    .alert-high .alert-card-hdr i {
      color: #ea580c;
    }
    .alert-high .alert-intro {
      color: #7c2d12;
    }
    .alert-danger {
      border-left: 5px solid #dc2626;
    }
    .alert-danger .alert-card-hdr {
      background: #fef2f2;
      color: #7f1d1d;
    }
    .alert-danger .alert-card-hdr i {
      color: #dc2626;
    }
    .alert-danger .alert-intro {
      color: #7f1d1d;
    }
    .pg-footer {
      padding: 12px 20px 14px;
      border-top: 1px solid var(--gray-200);
      background: #fafbfc;
    }
    .pg-footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .pg-footer-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .pg-footer-note {
      font-size: 12px;
      color: var(--gray-600);
      line-height: 1.55;
    }
    .pg-footer-date {
      font-family: "DM Mono", monospace;
      font-size: 11.5px;
      color: var(--gray-600);
      font-weight: 500;
    }
    .pg-footer-contact {
      display: flex;
      gap: 20px;
      margin-top: 2px;
    }
    .pg-footer-contact-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--gray-600);
    }
    .pg-footer-contact-item i {
      font-size: 11px;
      color: var(--blue);
      opacity: 0.8;
    }
    .pg-footer-cert {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding-left: 20px;
      border-left: 1px solid var(--gray-200);
    }
    .pg-footer-cert-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--gray-600);
      letter-spacing: 0.06em;
    }
    .pg-footer-cert-img {
      width: 50px;
      height: 50px;
      object-fit: contain;
      border: 1px solid var(--gray-200);
      background: var(--gray-50);
    }
    .pg-footer-cert-copy {
      font-size: 10px;
      color: var(--gray-400);
      text-align: center;
      line-height: 1.5;
    }
  </style>
  <body>
    <div id="report-screen"></div>
    <script>
      let allCharts = [];
      function destroyAllCharts() {
        allCharts.forEach((c) => {
          try {
            c.destroy();
          } catch (e) {}
        });
        allCharts = [];
      }
      function tsToDateStr(ts) {
        const d = new Date(Number(ts));
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return y + "/" + m + "/" + day;
      }
      function fmtDate(d) {
        return d.replace(/\//g, ".");
      }
      function genderLabel(g) {
        if (g === "0" || g === 0 || g === "女") return "女";
        if (g === "1" || g === 1 || g === "男") return "男";
        return String(g);
      }
      function levelToScore(text) {
        const map = { 低: 12, 稍低: 9, 中: 6, 稍高: 3, 高: 1 };
        const t = String(text).trim();
        return map[t] !== undefined ? map[t] : 6;
      }

      // ── 人形圖片 + canvas 三條線 overlay ──────────────────────────────────────
      function buildBodyHTML(leftRaw, rightRaw, gender, uid) {
        const imgSrc =
          genderLabel(gender) === "男"
            ? "https://raw.githubusercontent.com/Wayne-Chou/report-template/refs/heads/main/assets/figure_male.png"
            : "https://raw.githubusercontent.com/Wayne-Chou/report-template/refs/heads/main/assets/figure_female.png";
        const canvasId = uid + "_body_canvas";
        return `
<div style="position:relative;display:inline-block;width:100%">
  <img src="${imgSrc}" alt="人形" id="${uid}_body_img" style="width:100%;display:block;"
       onload="drawBodyLines('${canvasId}','${uid}_body_img',${Math.abs(parseFloat(leftRaw) || 0)},${Math.abs(parseFloat(rightRaw) || 0)})"/>
  <canvas id="${canvasId}" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;"></canvas>
</div>
<div style="display:flex;gap:10px;justify-content:center;margin-top:6px;font-size:11px;color:#374151;">
  <span style="display:flex;align-items:center;gap:4px;"><span style="width:16px;height:2.5px;background:#22c55e;display:inline-block;border-radius:2px;"></span>重心</span>
  <span style="display:flex;align-items:center;gap:4px;"><span style="width:16px;height:2.5px;background:#ef4444;display:inline-block;border-radius:2px;"></span>右偏</span>
  <span style="display:flex;align-items:center;gap:4px;"><span style="width:16px;height:2.5px;background:#f5a623;display:inline-block;border-radius:2px;"></span>左偏</span>
</div>`;
      }

      // 圖片載入後呼叫，在 canvas 上畫三條線
      function drawBodyLines(canvasId, imgId, leftDeg, rightDeg) {
        const img = document.getElementById(imgId);
        const canvas = document.getElementById(canvasId);
        if (!img || !canvas) return;

        const w = img.offsetWidth;
        const h = img.offsetHeight;
        canvas.width = w;
        canvas.height = h;

        const ctx = canvas.getContext("2d");

        const hipX = w * 0.5;
        const hipY = h * 0.58;
        const shY = h * 0.28;
        const len = hipY - shY;

        function drawLine(deg, dir, color) {
          const rad = (deg * Math.PI) / 180;
          const ex = hipX + dir * len * Math.sin(rad);
          const ey = hipY - len * Math.cos(rad);
          ctx.beginPath();
          ctx.moveTo(hipX, hipY);
          ctx.lineTo(ex, ey);
          ctx.strokeStyle = color;
          ctx.lineWidth = 3;
          ctx.lineCap = "round";
          ctx.stroke();
        }

        drawLine(leftDeg, -1, "#f5a623"); // 黃：左偏
        drawLine(0, 0, "#22c55e"); // 綠：垂直重心
        drawLine(rightDeg, 1, "#ef4444"); // 紅：右偏
      }

      function buildPageHTML(no, data) {
        const uid = "p" + no.replace(/\W/g, "_");
        const first = data[0];
        const last = data[data.length - 1];
        const firstDate = fmtDate(tsToDateStr(first.date));
        const lastDate = fmtDate(tsToDateStr(last.date));
        const gaugeScore = levelToScore(last["跌倒風險等級"]);
        const alertHTML = buildAlertHTML(gaugeScore);

        // 取得左右偏移值
        const leftRaw = last["左偏移"] ?? 0;
        const rightRaw = last["右偏移"] ?? 0;
        const bodyHTML = buildBodyHTML(leftRaw, rightRaw, first.gender, uid);

        const div = document.createElement("div");
        div.className = "page";
        div.innerHTML = `
          <div class="pg-header">
            <div class="hdr-logo">
              <div><img style="width:45px;display:block" src="https://raw.githubusercontent.com/Wayne-Chou/report-template/refs/heads/main/assets/logo.png" alt="建豐健康科技"></div>
              <div>
                <div class="hdr-logo-text">建豐健康科技</div>
                <div class="hdr-logo-sub">FongAI Co., Ltd</div>
              </div>
            </div>
            <div class="hdr-title">
              <div class="hdr-title-sub">Fall Risk Retrospective &amp; Recovery Report</div>
              <div class="hdr-title-main">長者防跌回溯與復能建議報告</div>
            </div>
          </div>

          <div class="pg-body">
            <div class="top-row">
              <div class="top-left">
                <div class="stick-panel">
                  <div class="stick-figure">${bodyHTML}</div>
                  <div class="stick-last-date">最近鑑測日期<strong>${lastDate}</strong></div>
                </div>

                <div class="info-card">
                  <div class="info-card-hdr">個人資訊</div>
                  <div class="info-card-body">
                    <div class="kv-list">
                      <div class="kv-row"><span class="kv-lbl"><i class="fa-solid fa-id-badge"></i>長者姓名</span><span class="kv-val">${first.name}</span></div>
                      <div class="kv-row"><span class="kv-lbl"><i class="fa-solid fa-user"></i>性別 / 年齡</span><span class="kv-val">${genderLabel(first.gender)} / ${first.age}</span></div>
                      <div class="kv-row"><span class="kv-lbl"><i class="fa-solid fa-calendar-days"></i>回溯期間</span><span class="kv-val mono">${firstDate} – ${lastDate}</span></div>
                      <div class="kv-row"><span class="kv-lbl"><i class="fa-solid fa-location-dot"></i>檢測據點</span><span class="kv-val">${first.location}</span></div>
                    </div>
                  </div>
                </div>

                <div class="gauge-panel">
                  <div class="gauge-panel-hdr">跌倒風險等級</div>

      function buildGauge(canvasId, score) {
        const rc = {
          danger: "#ff5757",
          high: "#ffa203",
          medium: "#ffd039",
          low: "#8cff00",
          veryLow: "#4ffa00",
        };
        function getLevel(val) {
          if (val <= 2) return { text: "危險", color: rc.danger };
          if (val <= 5) return { text: "高風險", color: rc.high };
          if (val <= 8) return { text: "中度", color: rc.medium };
          if (val <= 11) return { text: "稍低", color: rc.low };
          return { text: "低風險", color: rc.veryLow };
        }
        const level = getLevel(score);
        allCharts.push(
          new Chart(document.getElementById(canvasId), {
            type: "doughnut",
            data: {
              datasets: [
                {
                  data: [1, 1, 1, 1, 1],
                  backgroundColor: [
                    rc.danger,
                    rc.high,
                    rc.medium,
                    rc.low,
                    rc.veryLow,
                  ],
                  circumference: 180,
                  rotation: 270,
                  borderWidth: 3,
                  borderColor: "#ffffff",
                  cutout: "80%",
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              layout: { padding: { top: 30, bottom: 10 } },
              plugins: {
                legend: { display: false },
                tooltip: { enabled: false },
              },
            },
            plugins: [
              {
                id: "needleAndText",
                afterDraw(chart) {
                  const { ctx, chartArea } = chart;
                  const cx = (chartArea.left + chartArea.right) / 2;
                  const cy = chartArea.bottom - 10;
                  const ir = chart.getDatasetMeta(0).controller.innerRadius;
                  ctx.save();
                  ctx.font = "bold 12px sans-serif";
                  ctx.fillStyle = "#1e293b";
                  ctx.textAlign = "center";
                  ctx.textBaseline = "middle";
                  ctx.fillText("風險等級：" + level.text, cx, cy);
                  const angle = Math.PI + Math.PI * (score / 12);
                  const sd = 10,
                    ed = ir - 2,
                    as = 8,
                    ba = 0.4;
                  const sx = cx + Math.cos(angle) * sd,
                    sy = cy + Math.sin(angle) * sd;
                  const tx = cx + Math.cos(angle) * ed,
                    ty = cy + Math.sin(angle) * ed;
                  ctx.beginPath();
                  ctx.moveTo(sx, sy);
                  ctx.lineTo(tx, ty);
                  ctx.strokeStyle = "#334155";
                  ctx.lineWidth = 2.5;
                  ctx.stroke();
                  ctx.beginPath();
                  ctx.moveTo(tx, ty);
                  ctx.lineTo(
                    tx - as * Math.cos(angle - ba),
                    ty - as * Math.sin(angle - ba),
                  );
                  ctx.lineTo(
                    tx - as * Math.cos(angle + ba),
                    ty - as * Math.sin(angle + ba),
                  );
                  ctx.closePath();
                  ctx.fillStyle = "#334155";
                  ctx.fill();
                  ctx.restore();
                },
              },
            ],
          }),
        );
      }

      function buildAlertHTML(score) {
        if (score >= 9)
          return `<div class="alert-card alert-good"><div class="alert-card-hdr"><i class="fa-solid fa-circle-check"></i>數據良好，仍需留意外在風險因子</div><div class="alert-card-body"><div class="alert-intro">本份報告各項評估數據均在正常範圍內，整體體能表現良好。然而跌倒風險並非單由生理數據決定，即使體能指標優異，仍可能因多重用藥交互作用、視力退化、認知功能下降或居家環境不安全等外在因素而提高跌倒機率，建議照護人員與家屬同步關注上述面向，定期進行全面性評估。</div></div></div>`;
        if (score >= 6)
          return `<div class="alert-card alert-mid"><div class="alert-card-hdr"><i class="fa-solid fa-triangle-exclamation"></i>中度風險，建議定期追蹤</div><div class="alert-card-body"><div class="alert-intro">本次評估顯示部分指標已達中度風險範圍，建議定期追蹤步態、平衡與下肢肌力變化，並留意用藥、視力及居家環境等外在風險因素；必要時尋求專業人員協助。</div></div></div>`;
        if (score >= 3)
          return `<div class="alert-card alert-high"><div class="alert-card-hdr"><i class="fa-solid fa-circle-exclamation"></i>風險稍高，建議安排專業評估</div><div class="alert-card-body"><div class="alert-intro">本次評估顯示跌倒風險偏高，建議安排醫療專業人員進一步評估步態、平衡與下肢肌力狀況，並同步檢視用藥、視力及居家環境安全，以降低再次跌倒風險。</div></div></div>`;
        return `<div class="alert-card alert-danger"><div class="alert-card-hdr"><i class="fa-solid fa-xmark-circle"></i>高度危險，建議儘速專業介入</div><div class="alert-card-body"><div class="alert-intro">本次評估顯示跌倒風險達高度危險等級，建議儘速由醫療、復健或照護專業人員進行全面性評估；必要時安排照護協助、輔具使用或復健介入，以降低再次跌倒及受傷風險。</div></div></div>`;
      }

      const rawData = sessionStorage.getItem("selectedPersonData");
